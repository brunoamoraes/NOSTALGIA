name: Atualizar pôsteres e capas
on:
  workflow_dispatch:
  schedule:
    - cron: '16 6 * * 1'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar TMDb e Last.fm
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python scripts/sync_media.py
      - name: Persistir somente dados públicos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/media.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar mídia BrunoVerse (TMDb / Last.fm)"
            git push
          fi
